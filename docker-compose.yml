services:

  front-service:
    build: ./Front
    ports:
      - "5000:80"
    depends_on:
      - gateway-service
    networks:
      - iac-network

  gateway-service:
    build: ./Gateway
    environment:
      JwtSettings__SecretKey: ${JWT_SECRET:-dev-only-change-me-before-production}
    ports:
      - "8080:8080"
    networks:
      - iac-network

  authentification-service:
    build: ./Authentification
    environment:
      ConnectionStrings__DockerDb: Host=${AUTH_DB_HOST};Database=${AUTH_DB_NAME};Username=${AUTH_DB_USER};Password=${AUTH_DB_PASSWORD}
      JwtSettings__SecretKey: ${JWT_SECRET:-dev-only-change-me-before-production}
      JwtSettings__Issuer: ${JWT_ISSUER:-AuthAPI}
      JwtSettings__Audience: ${JWT_AUDIENCE:-AuthAPIUsers}
      JwtSettings__ExpiryInMinutes: ${JWT_EXPIRY_MINUTES:-60}
    ports:
      - "5002:8080"
    networks:
      - iac-network

  product-service:
    build: ./Product
    environment:
      ConnectionStrings__DockerDb: Host=${PRODUCT_DB_HOST};Database=${PRODUCT_DB_NAME};Username=${PRODUCT_DB_USER};Password=${PRODUCT_DB_PASSWORD}
    ports:
      - "5001:8080"
    networks:
      - iac-network

networks:
  iac-network:
