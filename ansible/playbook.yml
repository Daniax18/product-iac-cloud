---
- name: Configure EC2 and deploy application
  hosts: ec2
  become: true
  vars:
    deploy_path: "/opt/iac-app"
    deploy_branch: "{{ lookup('env', 'DEPLOY_BRANCH') }}"
    repo_url: "{{ lookup('env', 'REPO_URL') }}"

  pre_tasks:
    - name: Wait for SSH to be ready
      wait_for_connection:
        timeout: 120
        sleep: 5

    - name: Gather facts
      setup:

  roles:
    - docker
    - app